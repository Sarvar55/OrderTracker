spring:
  application:
    name: order-tracker-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
    test-connection: ${MAIL_TEST_CONNECTION:false}
  config:
    import: vault://
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: approle
      fail-fast: true
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        application-name: order-tracker-service
        default-context: ""
        profile-separator: /

app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@ordertracker.local}
    from-name: ${MAIL_FROM_NAME:Order Tracker}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS}
  webhook:
    secret: ${WEBHOOK_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    max-age: ${CORS_MAX_AGE}

server:
  port: ${APP_PORT}
  shutdown: ${SERVER_SHUTDOWN}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
